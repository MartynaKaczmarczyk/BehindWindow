@if (places.length > 0) {
  <section class="place-list" aria-label="Obiekty w pobliżu">
    <h3>W pobliżu</h3>
    @for (place of places; track place.url) {
      <a class="place-link" [href]="place.url" target="_blank" rel="noopener noreferrer">
        @if (place.imageUrl) {
          <img class="place-image" [src]="place.imageUrl" [alt]="'Zdjęcie: ' + place.title" loading="lazy" />
        } @else {
          <span class="place-image-placeholder" aria-hidden="true">⌖</span>
        }
        <span class="place-info">
          <span class="place-title">{{ place.title }}</span>
          <span class="place-distance">{{ place.distanceMeters | number: '1.0-0' }} m <span aria-hidden="true">↗</span></span>
        </span>
      </a>
    }
  </section>
}
